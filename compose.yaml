services:
  db:
    image: postgres:17
    container_name: om-db
    environment:
      POSTGRES_DB: ordermanagement
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d ordermanagement"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      target: dev
    container_name: om-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/ordermanagement
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: app
    ports:
      - "8080:8080"
    volumes:
      - ./src:/workspace/src        # sửa code ở host, container thấy ngay
      - ./pom.xml:/workspace/pom.xml
      - m2cache:/root/.m2           # cache thư viện Maven

volumes:
  pgdata:
  m2cache: